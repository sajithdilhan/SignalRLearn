# This workflow will build a .NET project and run a Semgrep SAST scan
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
# Semgrep action replaced with explicit pip install so we control the semgrep CLI version
# SARIF upload: https://github.com/github/codeql-action/tree/main/upload-sarif

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# permissions needed to upload SARIF/code-scanning results
permissions:
  contents: read
  security-events: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install semgrep
      run: pip install --upgrade semgrep

    - name: Run Semgrep SAST scan
      id: semgrep
      run: |
        # Run semgrep and produce SARIF; don't fail the job just because semgrep had a non-zero exit code
        semgrep --config p/ci --sarif --output semgrep.sarif || true

    - name: Check semgrep SARIF
      id: check_sarif
      run: |
        if [ -f semgrep.sarif ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload Semgrep SARIF to GitHub Code Scanning
      if: steps.check_sarif.outputs.exists == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: semgrep.sarif

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal
