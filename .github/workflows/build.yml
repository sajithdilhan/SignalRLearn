# This workflow will build a .NET project and run a Semgrep SAST scan
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
# Semgrep action: https://github.com/returntocorp/semgrep-action
# SARIF upload: https://github.com/github/codeql-action/tree/main/upload-sarif

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Semgrep SAST scan
      uses: returntocorp/semgrep-action@v2
      with:
        # Use the recommended CI rule set; change to a custom ruleset or local path if desired
        config: 'p/ci'
        # Produce SARIF output so we can upload to GitHub Code Scanning
        output: 'sarif'
        sarif_file: 'semgrep.sarif'

    - name: Upload Semgrep SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: semgrep.sarif

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal
